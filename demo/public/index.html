<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>เดโมผู้ช่วยตอบคำถามโรงพยาบาล</title>
<style>
  :root { --bg:#0b1118; --panel:#121a24; --line:#223042; --text:#e6edf5; --mute:#8b9bb0; --acc:#7fb3e6; --me:#1d3550; --warn:#e6c36f; --good:#7fd1a8; --bad:#e69a9a; }
  @media (prefers-color-scheme: light) { :root { --bg:#f4f7fb; --panel:#fff; --line:#d9e2ee; --text:#1c2733; --mute:#5d6e82; --acc:#2f6fb0; --me:#dcebfa; --warn:#9a6b00; --good:#1d7a52; --bad:#b04040; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.55 system-ui, "Noto Sans Thai", sans-serif; display:flex; flex-direction:column; height:100dvh; }
  header { padding:12px 16px; border-bottom:1px solid var(--line); background:var(--panel); }
  header h1 { margin:0; font-size:16px; font-weight:600; }
  header p { margin:2px 0 0; font-size:12px; color:var(--warn); }
  main { flex:1; overflow-y:auto; padding:16px; max-width:760px; width:100%; margin:0 auto; display:flex; flex-direction:column; gap:12px; }
  .msg { max-width:88%; padding:10px 13px; border-radius:12px; white-space:pre-wrap; word-break:break-word; border:1px solid var(--line); background:var(--panel); }
  .me { align-self:flex-end; background:var(--me); }
  .meta { margin-top:6px; font-size:11px; color:var(--mute); display:flex; flex-wrap:wrap; gap:6px; }
  .tag { border:1px solid var(--line); border-radius:6px; padding:1px 6px; }
  .tag.guard { color:var(--warn); } .tag.cache { color:var(--acc); } .tag.bad { color:var(--bad); }
  form { display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--line); background:var(--panel); max-width:760px; width:100%; margin:0 auto; }
  input { flex:1; padding:10px 12px; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--text); font:inherit; min-width:0; }
  button { padding:10px 16px; border-radius:10px; border:1px solid var(--acc); background:transparent; color:var(--acc); font:inherit; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  .hint { color:var(--mute); font-size:13px; }
</style>
</head>
<body>
<header>
  <h1>ผู้ช่วยตอบคำถามโรงพยาบาล (ระบบทดลอง)</h1>
  <p>ข้อมูลทั้งหมดเป็นข้อมูลสมมติ ไม่ใช่คำแนะนำทางการแพทย์ หากฉุกเฉินโทร 1669 สายด่วนสุขภาพจิต 1323</p>
</header>
<main id="log"><div class="hint">ลองถาม เช่น "OPD เปิดกี่โมง" "ขอเบอร์โทร" "เลื่อนนัดยังไง" แล้วดูป้ายใต้คำตอบว่าระบบจัดการแบบไหน (ตอบจากเอกสาร / ตอบตายตัวตามกฎ / ใช้คำตอบเดิมเมื่อถามซ้ำ)</div></main>
<form id="f"><input id="q" autocomplete="off" placeholder="พิมพ์คำถาม" maxlength="1500"><button id="b">ส่ง</button></form>
<script>
const log = document.getElementById("log"), q = document.getElementById("q"), b = document.getElementById("b");
let session = ""; try { session = localStorage.getItem("demo-session") || ""; } catch {}
if (!session) { session = Math.random().toString(36).slice(2) + Date.now().toString(36); try { localStorage.setItem("demo-session", session); } catch {} }
const GUARD = { red_flag: "เคสอันตราย (ตอบตามกฎ)", blocked: "หัวข้อที่ไม่ตอบ (ตามกฎ)", canned: "คำตอบสำเร็จรูป", no_context: "ไม่พบเอกสารที่เกี่ยวข้อง", unverified_number: "แก้เลขที่ไม่ตรงเอกสาร", repeat_warn: "ถามซ้ำหลายครั้ง", repeat_cached: "ใช้คำตอบเดิม (ถามซ้ำ)" };
function add(text, cls, meta) {
  const d = document.createElement("div"); d.className = "msg " + (cls || ""); d.textContent = text;
  if (meta && meta.length) { const m = document.createElement("div"); m.className = "meta"; for (const [t, c] of meta) { const s = document.createElement("span"); s.className = "tag " + (c || ""); s.textContent = t; m.appendChild(s); } d.appendChild(m); }
  log.appendChild(d); log.scrollTop = log.scrollHeight; return d;
}
document.getElementById("f").addEventListener("submit", async (e) => {
  e.preventDefault(); const text = q.value.trim(); if (!text) return;
  q.value = ""; b.disabled = true; add(text, "me"); const wait = add("กำลังคิด...");
  try {
    const r = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ question: text, session }) });
    const d = await r.json(); wait.remove(); const meta = [];
    if (d.guard) meta.push([GUARD[d.guard.kind] || d.guard.kind, d.guard.kind === "repeat_cached" ? "cache" : "guard"]);
    if (d.mode === "429") meta.push(["ถูกพักการใช้งานชั่วคราว" + (d.retryAfter ? ` (รอ ${d.retryAfter} วินาที)` : ""), "bad"]);
    if (d.sources && d.sources.length) meta.push(["ที่มา: " + d.sources.slice(0, 3).join(", ")]);
    add(d.text || "ไม่มีคำตอบ", "", meta);
  } catch { wait.remove(); add("เชื่อมต่อไม่ได้", "", [["ผิดพลาด", "bad"]]); }
  b.disabled = false; q.focus();
});
</script>
</body>
</html>
